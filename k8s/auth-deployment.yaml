apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-valkey
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z valkey 6379; do echo waiting for valkey; sleep 2; done']
      containers:
        - name: auth-server
          image: playground-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: playground-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: playground-secret
                  key: database-url
            - name: VALKEY_URL
              value: "redis://valkey:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: playground-secret
                  key: jwt-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
