apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: playground
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: playground-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Bind the SSR dev server to all interfaces so the k8s probe and
            # Service can reach it.
            - name: HOST
              value: "0.0.0.0"
            # All backend calls go through the cluster-internal Traefik ingress
            # so `/api/*`, `/auth/*`, `/ws/*` and `/scalar` are routed correctly.
            - name: RUST_API_BASE_URL
              value: "http://traefik.kube-system.svc.cluster.local"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
