apiVersion: batch/v1
kind: Job
metadata:
  name: migration
  namespace: playground
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: migration
          image: playground-api:latest
          imagePullPolicy: IfNotPresent
          command: ["server"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: playground-secret
                  key: database-url
            - name: RUST_LOG
              value: "debug"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
  backoffLimit: 5
