apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-server
  namespace: playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-server
  template:
    metadata:
      labels:
        app: websocket-server
    spec:
      initContainers:
        - name: wait-for-valkey
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z valkey 6379; do echo waiting for valkey; sleep 2; done']
      containers:
        - name: websocket-server
          image: playground-ws:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: playground-config
          env:
            - name: VALKEY_URL
              value: "redis://valkey:6379"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
